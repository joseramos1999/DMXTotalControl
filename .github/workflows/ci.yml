name: CI

# Compila DMX Total Control en Windows y pasa sus pruebas en cada cambio de main
# y en cada pull request. Se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      # Los paquetes del README, en el entorno UCRT64 de MSYS2: MINGW64 se está
      # retirando y ya no tiene libusb ni libftdi
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: unzip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p libusb:p libftdi:p libmad:p libsndfile:p fftw:p tools-git:p
            qt6-base:p qt6-declarative:p qt6-3d:p qt6-multimedia:p qt6-serialport:p qt6-websockets:p
            qt6-imageformats:p qt6-svg:p qt6-tools:p qt6-shadertools:p

      # Las interfaces DMX USB de FTDI: la biblioteca de importación del SDK D2XX
      - name: SDK D2XX de FTDI
        run: |
          mkdir -p /c/projects/D2XXSDK && cd /c/projects/D2XXSDK
          curl -sSL -o cdm.zip https://qlcplus.org/misc/CDM-v2.12.36.20-WHQL-Certified.zip
          unzip -o -q cdm.zip
          cd amd64
          gendef - ftd2xx64.dll > ftd2xx.def
          dlltool -k --input-def ftd2xx.def --dllname ftd2xx64.dll --output-lib libftd2xx.a

      - name: Compilar
        run: BUILD_TYPE=Release bash ./build-windows.sh --no-deploy

      - name: Pruebas
        run: bash ./.github/run-tests.sh

      # Si algo falla, la salida completa de las pruebas queda en el run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pruebas
          path: build/dtc/test/*.txt
          if-no-files-found: ignore
